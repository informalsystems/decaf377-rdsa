[package]
name = "decaf377-rdsa"
edition = "2021"
version = "0.11.0"
authors = ["Penumbra Labs <team@penumbralabs.xyz>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "decaf377-rdsa is a randomizable signature scheme using the decaf377 group."
repository = "https://github.com/penumbra-zone/decaf377-rdsa"

[dependencies]
# No Alloc, No Std
sha3 = { version = "0.10", default-features = false }
# decaf377 = { version = "0.10.1", default-features = false, git = "https://github.com/hu55a1n1/decaf377.git" }
cycles-curve-bn254 = { git = "https://github.com/cycles-money/cycles-curve", tag = "v1.0.0-alpha.1+arc" }
digest = { version = "0.9", default-features = false }
rand_core = { version = "0.6", optional = true }
hex = { version = "0.4", default-features = false }
# Only to satisfy Cargo
zeroize = { version = "1.7", default-features = false }
# Alloc, No Std
ark-ff = { version = "0.6.0", optional = true, default-features = false }
ark-serialize = { version = "0.6.0", optional = true }
# Std
serde = { version = "1", optional = true, features = ["derive"] }
thiserror = { version = "1.0", optional = true }

[dev-dependencies]
bincode = "1"
criterion = "0.3"
lazy_static = "1.4"
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1.0"

[[bench]]
name = "bench"
harness = false
required-features = ["rand", "arkworks"]

[features]
default = ["serde", "rand"]
alloc = ["ark-ff", "ark-serialize"]
std = ["alloc", "ark-ff/std", "sha3/std", "digest/std", "hex/std", "rand_core/std", "thiserror"] # "decaf377/arkworks"
# serde implies std so Error implements std::error::Error (needed for ? with anyhow in consumers)
serde = ["dep:serde", "std"]
parallel = ["ark-ff/parallel"] # "decaf377/parallel"
# TODO: rand_core is currently unconditional; make it optional behind this feature
rand = []
# u32_backend = ["decaf377/u32_backend"]

# Create profile for running checks in CI that are mostly "release" mode,
# but also checking the `debug_assert `lines.
[profile.ci]
inherits = "release"
debug-assertions = true
